<footer class="site-footer">
  <div class="site-wrapper">
    <div class="site-footer-bottom">
      <span>
        <a href="https://github.com/carmelolg/shizuka" target="_blank" rel="noopener noreferrer">Shizuka</a>
        theme by
        <a href="https://github.com/carmelolg" target="_blank" rel="noopener noreferrer">carmelolg</a>
      </span>

      <span>
        {{- $posts := where .Site.RegularPages "Section" "posts" -}}
        {{ i18n "articles_written" (len $posts) }}
      </span>
    </div>
  </div>
</footer>

{{- end }}
