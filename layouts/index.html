{{ define "main" }}
<div class="home-latest-section">
  <div class="home-latest-header">
    <p class="home-section-title">Posts</p>
  </div>

  <div class="home-post-list">
    <ul class="post-list">
      {{- $posts := where .Site.RegularPages "Section" "posts" -}}
      {{- range $posts -}}
      <li class="post-list-item">
        <div class="post-list-header">
          <h2 class="post-list-title">{{ .Title }}</h2>

          <div class="post-list-meta">
            <time datetime="{{ .Date.Format "2006-01-02" }}">
              {{ .Date.Format $.Site.Params.dateFormat }}
            </time>

            <span class="post-list-reading">
              {{ .ReadingTime }} min
            </span>

            <a href="{{ .RelPermalink }}#comments" class="post-list-comments">
              <span
                class="gc-counter"
                data-url="{{ .Permalink }}"
                data-uid="{{ .RelPermalink }}"
              ></span>
            </a>
          </div>
        </div>

        <div class="post-list-content">
          {{ .Content }}
        </div>
      </li>
      {{- end -}}
    </ul>
  </div>
</div>

<script type="text/javascript">
  function __semio__onload__counter() {
    __semio__helpers_counter("Adele-Valeria-s-Blog");
  }

  (function () {
    var gc = document.createElement("script");
    gc.type = "text/javascript";
    gc.async = true;
    gc.defer = true;
    gc.onload = __semio__onload__counter;
    gc.src = "https://integration.graphcomment.com/helpers_counter.js?" + Date.now();
    (document.head || document.body).appendChild(gc);
  })();
</script>
{{ end }}
